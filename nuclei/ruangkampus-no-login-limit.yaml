id: ruangkampus-login-no-rate-limit

info:
  name: RuangKampus Login Attempts Have No Rate Limit
  author: codex
  severity: low
  description: |
    Sends five invalid login attempts using a reserved synthetic email and
    checks that each receives the normal authentication failure response.
    Intended only for the localhost RuangKampus training application.
  tags: training,ruangkampus,authentication,rate-limit

http:
  - method: POST
    path:
      - "{{BaseURL}}/api/login?lab-check=1"
      - "{{BaseURL}}/api/login?lab-check=2"
      - "{{BaseURL}}/api/login?lab-check=3"
      - "{{BaseURL}}/api/login?lab-check=4"
      - "{{BaseURL}}/api/login?lab-check=5"
    headers:
      Content-Type: application/json
    body: '{"email":"nuclei-invalid-user@demo.test","password":"invalid-demo-password"}'
    req-condition: true
    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 401 && status_code_2 == 401 && status_code_3 == 401 && status_code_4 == 401 && status_code_5 == 401"
